//	==================================================
//	BE-4 global engine configuration.
//
//	Manufacturer: Blue Origin
//
//	=================================================================================
//	BE-4
//	Vulcan, New Glenn
//
//	Dry Mass: 2250 Kg
//	Thrust (SL): 2400 kN
//	Thrust (Vac): 2647.5 kN
//	ISP: 305 SL / 341 Vac
//	Burn Time: 400
//	Chamber Pressure: 13.4 MPa
//	Propellant: LOX / CH4
//	Prop Ratio: 3.6
//	Throttle: 40% to 100%
//	Nozzle Ratio: 40
//	Ignitions: 4
//	=================================================================================

//	Sources:

//	Blue Origin - BE-4 engine:						https://www.blueorigin.com/be4
//	United Launch Alliance - BE-4 rocket engine:	http://www.ulalaunch.com/uploads/docs/BE-4_Fact_Sheet_Web_Final_2.pdf
//	Space Launch Report - Vulcan launch vehicle:	http://www.spacelaunchreport.com/vulcan.html
//	NASASpaceFlight - IAF Blue Origin presentation: https://forum.nasaspaceflight.com/index.php?topic=10685.msg1665037#msg1665037

//	Used by:

//	* BigBlueRefilled

//	==================================================

@PART[BBR_26_JE_JE4]:NEEDS[RealismOverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
	%category = Engine
	@tags ^= :$: USA blue origin bo be-4 liquid pump booster lqdhydrogen lqdoxygen

	%specLevel = prototype

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal],*
	{
		@gimbalRange = 5.0 // questin really wants this to be 5 
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = BE-4 Block 1
		origMass = 2.25
		description = BE4 is the powerhouse of the New Glenn rocket, producing a whopping 550k lbf of thrust
		CONFIG
		{
			name = BE-4 Block 1
			specLevel = prototype
			minThrust = 978.608
			maxThrust = 2446.52
			heatProduction = 100
			massMult = 1.0
			ullage = True
			pressureFed = False
			ignitions = 4

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}

			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4268
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5732
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 341
				key = 1 305
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				name = BE-4_550
				testedBurnTime = 1590	//Assume same as RD-180
				ratedBurnTime = 400
				safeOverburn = true
				
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				
				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.995
			}
		}
		CONFIG
		{
			name = BE-4 Block 2
			specLevel = prototype
			minThrust = 978.608
			maxThrust = 2780.13
			heatProduction = 100
			massMult = 1.0
			ullage = True
			pressureFed = False
			ignitions = 4
			description = A nice facelift for BE4, going from 550k lbf to 625k lbf.

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}

			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4268
				DrawGauge = True
			}

			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5732
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 337
				key = 1 302
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				name = BE-4_625
				testedBurnTime = 1590	//Assume same as RD-180
				ratedBurnTime = 400
				safeOverburn = true
				
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				
				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.995
			}
		}
		CONFIG
		{
			name = BE-4 Block 2 Subcooled
			specLevel = prototype
			minThrust = 978.608
			maxThrust = 2846.86
			heatProduction = 100
			massMult = 1.0
			ullage = True
			pressureFed = False
			ignitions = 4
			description = Using subcooled propellants, Blue origin somehow got even more out of this, further uprating from 625k lbf to 640k lbf.

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}

			PROPELLANT
			{
				name = CooledLqdMethane
				ratio = 0.4268
				DrawGauge = True
			}

			PROPELLANT
			{
				name = CooledLqdOxygen
				ratio = 0.5732
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 346
				key = 1 307
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				name = BE-4_640
				testedBurnTime = 1590	//Assume same as RD-180
				ratedBurnTime = 400
				safeOverburn = true
				
				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				
				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.995
			}
		}
	}
}
@PART[BBR_26_JE_JE4]:AFTER[RealismOverhaulEngines]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG,*
		{
			%LinkB9PSModule[engineSwitch] { subtype = BE-4 }
		}
		@CONFIG[BE-4 Block 2]
		{
			@LinkB9PSModule[engineSwitch] { @subtype = BE-4?V2 }
		}
		@CONFIG[BE-4 Block 2 Subcooled]
		{
			@LinkB9PSModule[engineSwitch] { @subtype = BE-4?V3 }
		}
	}
}
