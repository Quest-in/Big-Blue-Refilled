			name = BE-3U Block 1
			specLevel = operational
			maxThrust = 711.50
			minThrust = 444.82
			ullage = True
			ignitions = 10
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7286
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2714
			}
			atmosphereCurve
			{
				key = 0 445
				key = 1 245
			}
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.500
			}

			// Insufficient data, just use BE-3PM data
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 9100		//Tested to 9100 seconds? Fairly simple and understressed engine, designed to be reused.
				ratedBurnTime = 644
				safeOverburn = true
				overburnPenalty `= 1.0

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
