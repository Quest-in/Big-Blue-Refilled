//	==================================================
//	BE-7
//
//	Manufacturer: Blue Origin
//
//	=================================================================================
//	BE-7
//	New Glenn / Blue Moon
//
//	Dry Mass: ~115kg (educated guesstimate)
//	Thrust (SL): ??? kN
//	Thrust (Vac): 44.482 kN (10 klbf)
//	ISP: ??? SL / 460 Vac
//	Burn Time: 2500s (wow)
//	Chamber Pressure: ???
//	Propellant: LOX / LH2
//	Prop Ratio: 6.42:1
//	Throttle: 8.9kn to 44.4kn
//	Nozzle Ratio: ???	
//	Ignitions: Infinite (probably wrong but i dont really care)
//	=================================================================================

//	Sources:
//	https://en.wikipedia.org/wiki/BE-7
//  https://www.blueorigin.com/engines

//	Used by: BigBlueRefilled
//	==================================================
@PART[BBR_26_JE_JE7]:NEEDS[RealismOverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
	@tags ^= :$: USA blue origin bo BE-7 3u liquid pump upper lqdhydrogen lqdoxygen
	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}
	!MODULE[ModuleB9PartSwitch],*{}
	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator] {}
	!RESOURCE,*{}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 10
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 8
	}

	MODULE
	{
		name = ModuleEngineConfigs
		origMass = 0.115
		configuration = BE-7
		modded = false
		description = BE-7, Engine used on the Blue Moon lander and GS3.
		CONFIG
		{
			name = BE-7
			specLevel = operational
			maxThrust = 44.482
			minThrust = 8.896
			ullage = True
			ignitions = 0
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.714
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.286
			}
			atmosphereCurve
			{
				key = 0 460
				key = 1 200 // i have zero fucking clue what this should be so you get 200s
			}
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.500
			}

			// Insufficient data, just use RL-10 data
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 9100		//Tested to 9100 seconds? Fairly simple and understressed engine, designed to be reused.
				ratedBurnTime = 2500
				safeOverburn = true
				overburnPenalty `= 1.0

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}
				
                // Shit taken from RL10 CE-CE
				ignitionReliabilityStart = 0.99975
				ignitionReliabilityEnd = 0.99995
				cycleReliabilityStart = 0.99975
				cycleReliabilityEnd = 0.99995
			}
		}
	}
}
