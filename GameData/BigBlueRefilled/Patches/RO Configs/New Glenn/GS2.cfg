@PART[BBR_26_Jacana_JS2]:NEEDS[RealismOverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    MODULE
    {
        name = ModuleFuelTanks
        volume = 500000
        type = Tank-Iso-AlLi
        basemass = -1
    }
    @MODULE:HAS[#moduleID[tanklength]]
    {
        @SUBTYPE:HAS[#name[Stubby]]
        {
            !volumeAddedToParent = hellonumberthief
            @addedMass = -2.68
            %MODULE
            {
                IDENTIFIER
                {
                    name = ModuleFuelTanks
                }
                DATA
                {
                    volume = 270000    
                }
            }
        }
        @SUBTYPE:HAS[#name[Shortened]]
        {
            !volumeAddedToParent = hellonumberthief
            @addedMass = -1.34
            %MODULE
            {
                IDENTIFIER
                {
                    name = ModuleFuelTanks
                }
                DATA
                {
                    volume = 385000
                }
            }
        }
        @SUBTYPE:HAS[#name[Extended]]
        {
            !volumeAddedToParent = hellonumberthief
            @addedMass = 1.34
            %MODULE
            {
                IDENTIFIER
                {
                    name = ModuleFuelTanks
                }
                DATA
                {
                    volume = 615000
                }
            }
        }
        
    }
}
@PART[BBR_26_Jacana_JS2Mount]:NEEDS[RealismOverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    MODULE
    {
        name = ModuleFuelTanks
        volume = 750
        type = Tank-Iso-Comp-HP
        basemass = -1
        TANK
        {
            name = HTP
            amount = Full
            maxAmount = 100%
        } 
    }
}