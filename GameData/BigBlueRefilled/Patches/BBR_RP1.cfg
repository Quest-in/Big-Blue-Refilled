// Engines
@PART[BBR_26_JE_JE4]:FOR[xxxRP0]:BEFORE[RealismOverhaulEnginesPost]
{
    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG[BE-4?Block?1?]
        {
            %techRequired = stagedCombustion2014
            %entryCost = 19730
            %cost = 1973
        }
        @CONFIG[BE-4?Block?0?]
        {
            %techRequired = stagedCombustion2014
            %entryCost = 19530
            %cost = 1953
