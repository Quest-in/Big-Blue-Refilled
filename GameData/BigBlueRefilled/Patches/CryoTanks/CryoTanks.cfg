@PART[BBR_26_Jacana_JS1|BBR_26_Jacana_JS2|BBR_26_Jacana_JS1_Long|BBR_26_Jacana_JS2_Long|BBR_26_Jacana_JS3_GEN1|BBR_26_Jacana_RS2|BBR_26_BM_MK1_TOP]:FOR[BigBlueRefilled]:NEEDS[CryoTanks,!RealFuels]
{
    MODULE
    {
        name =  ModuleCryoTank
        moduleID = basicBoiloff
        CoolingCost = 0.01
        CoolingEnabled = False

        BOILOFFCONFIG
        {
            // The fuel name to boil off
            FuelName = LqdMethane
            // The rate of boiloff, in % per game hour
            BoiloffRate = 0.05
            // The fuel cooling rate in EC per 1000 units per second. This is optional and additive to the rate in the base module
            CoolingCost = 0.08
        }
        BOILOFFCONFIG
        {
            // The fuel name to boil off
            FuelName = LqdHydrogen
            // The rate of boiloff, in % per game hour
            BoiloffRate = 0.05
            // The fuel cooling rate in EC per 1000 units per second. This is optional and additive to the rate in the base module
            CoolingCost = 0.02
        }
    }
}
@PART[BBR_26_BM_MK1_TOP]:FOR[BigBlueRefilled]:NEEDS[CryoTanks]
{
    @MODULE[ModuleCryoTank]
    {
        
        @BOILOFFCONFIG:HAS[#FuelName[LqdMethane]]
		{
            @BoiloffRate = 0.03
            @CoolingCost = 0.02     
		}
        @BOILOFFCONFIG:HAS[#FuelName[LqdHydrogen]]
        {
            @BoiloffRate = 0.03
            @CoolingCost = 0.05      
        }
    }
}