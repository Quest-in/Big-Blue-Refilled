@PART[BBR_26_JE_JE3U]:NEEDS[!RealismOverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 0.73
    @MODULE[ModuleEnginesFX]
    {
        @maxThrust = 711.50
    }
    @MODULE:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE:HAS[#name[BE-3U?V2]]
		{
			@maxThrust = 889.50
		}
		@SUBTYPE:HAS[#name[BE-3U?V3]]
		{
			@maxThrust = 941.50
		}
		+SUBTYPE
		{
			name = BE-3U Theoretical
			title = JE-3U Theoretical
			descriptionSummary = JE-3U was SUPPOSEDLY designed for this thrust, but the description writer believes that Big blue lied to us. Use if you want to hit the 45t to LEO goal.
			descriptionDetail = <b>Max Thrust</b>: <color="yellow">Im too tired to calculate right now</color> kN (ASL), <color="yellow">1423.43</color> kN (Vac) <br><b>Isp</b>: 245 s (ASL), 445 s (Vac) <br><b>Alternator</b>: 3 EC/s
			primaryColor = Black
			secondaryColor = Blue
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
					engineID = BE3U
				}
				DATA
				{
					maxThrust = 1423.43
				}
			}
		}
	}
}
@PART[BBR_26_JE_JE3U]:HAS[#SystemScale[?eal]]:FOR[ZZZ_BigBlueRefilled]
{
    @breakingForce = 3000 // stage sep is my passion
	@breakingTorque = 3000
	@crashTolerance = 250
}