        @amount = 6000
        @maxAmount = 6000
    }
}
@PART[BBR_26_BM_MK1_BOTTOM]:NEEDS[!Realismoverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @RESOURCE[Oxidizer]
    {
        @amount = 400
        @maxAmount = 400
    }
}