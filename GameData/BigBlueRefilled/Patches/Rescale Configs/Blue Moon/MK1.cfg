@PART[BBR_26_BM_MK1_TOP]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 2
}
@PART[BBR_26_BM_MK1_BOTTOM]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 1.1
}
@PART[BBR_26_BM_MK1_LOG]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 0.1
}
@PART[BBR_26_BM_MK1_TOP]:NEEDS[!Realismoverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
