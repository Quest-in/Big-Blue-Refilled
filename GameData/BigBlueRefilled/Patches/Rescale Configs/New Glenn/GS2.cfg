// 7x2
@PART[BBR_26_Jacana_Fairing]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 1.5
    @MODULE[ModuleSimpleAdjustableFairing]
    {
        @segmentLength = 1.6
        @shieldingCenter = 0, 5.94604, 0
        @scale = 1
        @CONE
        {
            @rootOffset = 0, 0, 0
        }
    }
}
@PART[BBR_26_Jacana_JS2]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 16
    @MODULE:HAS[#moduleID[ColorSwitch]]
    {
        @SUBTYPE:HAS[#name[Composite?GS2]]
        {
            @addedMass = -2.67
        }
    }
}
@PART[BBR_26_Jacana_JS2Mount]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @mass = 2.5
}
@PART[BBR_26_Jacana_JS2]:NEEDS[!Realismoverhaul]:HAS[#SystemScale[?eal]]:FOR[BigBlueRefilled]
{
    @RESOURCE[LqdHydrogen]
    {
        @amount = 360000
        @maxAmount = 360000
    }
    @RESOURCE[Oxidizer]
    {
        @amount = 24000
        @maxAmount = 24000
    }
    @MODULE:HAS[#moduleID[tanklength]]
    {
        @SUBTYPE:HAS[#name[Stubby]]
        {
            @volumeAddedToParent = -66960
            @addedMass = -2.68
        }
        @SUBTYPE:HAS[#name[Shortened]]
        {
            @volumeAddedToParent = -33480
            @addedMass = -1.34
        }
        @SUBTYPE:HAS[#name[Extended]]
        {
            @volumeAddedToParent = 33480
            @addedMass = 1.34
        }
    }
}

