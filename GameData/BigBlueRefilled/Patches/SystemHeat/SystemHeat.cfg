@PART[BBR_*]:HAS[@MODULE[ModuleCryoTank]]:AFTER[BigBlueRefilled]:NEEDS[SystemHeat,!RealFuels,!SystemHeatBoiloff]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.4
		moduleID = tank
		iconName = Icon_Snow
	}
	
	@MODULE[ModuleCryoTank]
	{
		@name = ModuleSystemHeatCryoTank
		systemHeatModuleID = tank

		@BOILOFFCONFIG:HAS[#FuelName[LqdHydrogen]]
		{
			CryocoolerTemperature = 300
			CoolingHeatCost = 0.4
		}
		@BOILOFFCONFIG:HAS[#FuelName[LqdMethane]]
		{
			CryocoolerTemperature = 400
			CoolingHeatCost = 0.18
		}
	}
}

// ~~~ Radiators ~~~
@PART[BBR_26_BM_MK1_TOP]:AFTER[BigBlueRefilled]:NEEDS[SystemHeat,!RealFuels]
{
	MODULE
	{
		name = ModuleSystemHeatRadiator
		moduleID = radiator
		systemHeatModuleID = default
		temperatureCurve
		{
			key = 0 0
			key = 200 95
		}
		
		// optional
		scalarModuleID = heat
		maxTempAnimation = 500
		maxRadiatorTemperature = 200
		emissivity = 0.5
		convectiveArea = 1.35
		
		// inherited but legacy, not required
		maxEnergyTransfer = 7500 // 150 * 50
		overcoolFactor = 0.25 // if capable of refrigeration, this radiator can cool to this fraction of its acive temp.
		isCoreRadiator = true // whether it can cool something that produces core heat vs only helping vital parts to not melt
		parentCoolingOnly = true // whether it will only cool the part it's attached to
		
		RESOURCE // consumed as a cost to the module's operation
		{
			name = ElectricCharge
			rate = 0.075
		}
	}
}