// ~~~~~~~~~ 7x2 ~~~~~~~~~
@PART[BBR_26_Jacana_JS1]:AFTER[BigBlueRefilled]:NEEDS[SystemHeat,!RealFuels,!SystemHeatBoiloff]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.4
		moduleID = tank
		iconName = Icon_Snow
	}
	MODULE
	{
		name = ModuleSystemHeatCryoTank
		CoolingEnabled = False
		systemHeatModuleID = tank
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			BoiloffRate = 0.04
			CoolingHeatCost = 0.4
			CryocoolerTemperature = 300
		}
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.01
			CoolingHeatCost = 0.18
			CryocoolerTemperature = 400
		}
	}
}
