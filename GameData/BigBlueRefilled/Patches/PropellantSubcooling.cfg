@PART[BBR_26_Jacana_JS1]:BEFORE[BigBlueRefilled]
{
    MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = subcoolSwitch
		switcherDescription = Subcooled Propellant
		switcherDescriptionPlural = Subcooled Propellants
		parentID:NEEDS[!RealFuels] = fuelSwitch
