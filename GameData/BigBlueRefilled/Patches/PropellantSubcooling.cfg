// ~~~~~~~~~ 7x2 ~~~~~~~~~
@PART[BBR_26_Jacana_JS1]:BEFORE[BigBlueRefilled]:NEEDS[!Realismoverhaul]
{
    MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = subcoolSwitch
		switcherDescription = Subcooled Propellant
		switcherDescriptionPlural = Subcooled Propellants
		parentID:NEEDS[!RealFuels] = fuelSwitch
		SUBTYPE
		{
			name = Standard Propellant
            primaryColor = Watermelon
            secondaryColor = Watermelon
		}

		SUBTYPE
		{
			name = Subcooled Propellant
			primaryColor = WeirdGreen
			secondaryColor = WeirdGreen
			volumeAddedToParent:NEEDS[!RealFuels] = 7290
		}
	}
}
