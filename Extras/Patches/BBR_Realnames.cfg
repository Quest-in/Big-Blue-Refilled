@PART[BBR_26_JE_CLUSTER]:AFTER[BigBlueRefilled]
{
    @title = BE-4 Engine Cluster
	@description = We slapped 7 of the BE-4s together and this came out, this makes it really easy to install on New Glenn.
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[B0]]
        {
            @title = BE-4 Block 0
            @descriptionSummary = BE-4 Block 0 has never flown but was a pathfinder for BE-4 Block 1
        }
        @SUBTYPE:HAS[#name[B1]]
        {
            @title = BE-4 Block 1
            @descriptionSummary = BE-4 Block 1 flown on the first 2 flights of New Glenn.
        }
        @SUBTYPE:HAS[#name[B2]]
        {
            @title = BE-4 Block 2
            @descriptionSummary = BE-4 Block 2 flown on the 3rd flight onwards of New Glenn. <color="red">Warranty hella void if used during static fire AND in a cluster.</color>
        }
        @SUBTYPE:HAS[#name[B3]]
        {
            @title = BE-4 Block 3
            @descriptionSummary = BE-4 Block 3 has been demonstrated on the test stand but has not yet flown.
        }
        @SUBTYPE:HAS[#name[BX]]
        {
            @title = BE-4 Block X
            @descriptionSummary = BE-4X, a purely theorethical Block following the same increase from JE-3U Block 3 to its original anticipated thrust.
        }
    }
}
@PART[BBR_26_JE_JE3U]:AFTER[BigBlueRefilled]
{
    @title = BE-3U Engine
	@description = Powers the upperstage and your payload into orbit and beyond, Supposedly designed and built off of the BE-3PM from New Shepard, but in reality it shares zero heritage
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[BE-3U]]
        {
            @title = BE-3U Block 1
            @descriptionSummary = BE-3U Block 1 originally intended for flight but never flew.
        }
        @SUBTYPE:HAS[#name[BE-3U?V1.5]]
        {
            @title = BE-3U Block 1.5
            @descriptionSummary = BE-3U Block 1.5 flown on the first 2 flights of New Glenn.
        }
        @SUBTYPE:HAS[#name[BE-3U?V2]]
        {
            @title = BE-3U Block 2
            @descriptionSummary = BE-3U Block 2 flown on the 3rd flight onwards of New Glenn.
        }
        @SUBTYPE:HAS[#name[BE-3U?V3]]
        {
            @title = BE-3U Block 3
            @descriptionSummary = BE-3U Block 3 has been demonstrated on the test stand but has not yet flown.
        }
         @SUBTYPE:HAS[#name[BE-3U?Theoretical]]
        {
            @title = BE-3U Theoretical
            @descriptionSummary = This is SUPPOSEDLY the original spec for the BE-3U engine, but this seems to be a bloated once flaunted number.
        }
    }
}
@PART[BBR_26_JE_JESPIKE]:AFTER[BigBlueRefilled]
{
    @title = BE-S Aerospike
    @description = Just a figment of your imagination... allegedly.
}
