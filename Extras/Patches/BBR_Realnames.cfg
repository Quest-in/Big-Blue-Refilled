@PART[BBR*]:AFTER[BigBlueRefilled]
{
    manufacturer = Blue Origin
}
// New Glenn 7x2
@PART[BBR_26_Jacana_Aft]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Aft Skirt
	@description = Covered in COMET and designed with crazy structural standards, able to house 7 BE-4 Engines as well as the built in landing gear. Designed to last for a minimum for 25 flights.
}
@PART[BBR_26_Jacana_Fin]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Forward Fin
	@description = Designed to help aerodynamically steer New Glenn on ascent and descent, can pull some serious angles while covered in COMET. <#ff2b2b>USER WARNING: Fin spawns upside down and must be turned the correct way manually. If not KSP goes mad.</color>
}
@PART[BBR_26_Jacana_Interstage]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Interstage
	@description = Connects the New Glenn 1st and 2nd Stages together and protects the BE-3U engines inside of it.
}
@PART[BBR_26_Jacana_Strake]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Aft Strake
	@description = Wing-like surface to provide lift and cross-range for the reusable first stage during its descent back to Earth.
}
@PART[BBR_26_Jacana_JS1]:AFTER[BigBlueRefilled]
{
    @title = New Glenn First Stage Tank
	@description = Holds a LARGE amount of propellant to loft the entire vehicle towards your destination!
}
@PART[BBR_26_Jacana_JS2]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Second Stage Tank
	@description = Gives your payload that final push into orbit and beyond!
}
@PART[BBR_26_Jacana_RS2]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Reusable Second Stage Tank
    @description = Just a figment of your imagination... allegedly.
}
@PART[BBR_26_Jacana_JS2Mount]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Second Stage Engine Mount
	@description = Used to connect your BE-3Us or BE-4Us to the second stage tank, also has RCS thrusters!
}
@PART[BBR_26_Jacana_JS3_GEN1]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Third Stage Tank
	@description = Umm we cant really explain this one... Heavily inspired on Questins "brain" and uh Blue Origin please dont send the legal team to Questins house.. thx
}
@PART[BBR_26_Jacana_JS3_GEN2]:AFTER[BigBlueRefilled]
{
    @title = Second Generation New Glenn Third Stage Tank 
}
@PART[BBR_26_Jacana_JS3_Interstage]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Third Stage Interstage
	@description = Can't explain how we designed this either, but its reall great for connecting GS2 and GS3 together.
}
@PART[BBR_26_Jacana_Fairing]:AFTER[BigBlueRefilled]
{
    @title = New Glenn Faring Adapter [SAF]
	@description = Manufactured out of carbon composite, built to protect the payload until its no longer needed, allegedly built to be reused. (Try at your own risk)
}
// Engines
@PART[BBR_26_JE_JE4]:AFTER[BigBlueRefilled]
{
    @title = BE-4 Engine
	@description = Built to launch New Glenn and as well as launch ULA's Vulcan Rocket. Plus finally allows us to be bees!
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[BE-4?V0]]
        {
            @title = BE-4 Block 0
            @descriptionSummary = BE-4 Block 0 has never flown but was a pathfinder for BE-4 Block 1
        }
        @SUBTYPE:HAS[#name[BE-4]]
        {
            @title = BE-4 Block 1
            @descriptionSummary = BE-4 Block 1 flown on the first 2 flights of New Glenn.
        }
        @SUBTYPE:HAS[#name[BE-4?V2]]
        {
            @title = BE-4 Block 2
            @descriptionSummary = BE-4 Block 2 flown on the 3rd flight onwards of New Glenn. <color="red">Warranty void if used during static fire.</color>
        }
        @SUBTYPE:HAS[#name[BE-4?V3]]
        {
            @title = BE-4 Block 3
            @descriptionSummary = BE-4 Block 3 demonstrated on the test stand but not yet flown.
        }
        @SUBTYPE:HAS[#name[BE-4?V4]]
        {
            @title = BE-4 Block X
            @descriptionSummary = BE-4X, a purely theorethical Block following the same increase from JE-3U Block 3 to its original anticipated thrust.
        }
    }
}
