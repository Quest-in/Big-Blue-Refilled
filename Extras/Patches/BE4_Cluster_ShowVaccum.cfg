@PART[BBR_26_JE_CLUSTER,BBR_26_JE_CLUSTER_9]:AFTER[BigBlueRefilled]
{
    @MODULE[ModuleWaterfallFX]:HAS[#moduleID[Outer]]
    {
        @CONTROLLER:HAS[#name[atmosphereDepth]]
        {
            @name = BBR_BE4_RawAtmosphereDepth_Outer
        }

        REMAPCONTROLLER
        {
            name = atmosphereDepth
            sourceController = BBR_BE4_RawAtmosphereDepth_Outer
            responseRateUp = 0
            responseRateDown = 0
            mappingCurve
            {
                key = 0 0.15 0 0
                key = 1 1.06 0 0
            }
        }
    }
}

@EFFECTTEMPLATE[BE4Full]:AFTER[BigBlueRefilled]
{
    @EFFECT,*
    {
        @SCALEMODIFIER,*:HAS[#controllerName[atmosphereDepth]]
        {
            @floatCurve
            {
                @key,0 = 0 0.15 0 0
            }
        }
        @FLOATMODIFIER,*:HAS[#controllerName[atmosphereDepth]]
        {
            @floatCurve
            {
                @key,0 = 0 0.15 0 0
            }
        }
    }
}

