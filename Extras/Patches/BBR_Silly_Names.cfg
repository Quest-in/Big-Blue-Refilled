// ~~~~~~~~~ Engines ~~~~~~~~~
@PART[BBR_26_JE_JE4]:FOR[BigBlueRefilled]
{
    @title = BE-42 Engine
	@description = Built to launch New Glenn and as well as launch ULA's Vulkan Rocket. Plus finally allows us to be bees!
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[BE-4?V0]]
        {
            @title = BE-42 Block btuh
            @descriptionSummary = BE-42 Block btuh has never flown but was a pathfinder for BE-4 Block 1
        }
        @SUBTYPE:HAS[#name[BE-4]]
        {
            @title = BE-42 Block 13
            @descriptionSummary = BE-42 Block 13 flown on the first 2 flights of New Glenn.
        }
        @SUBTYPE:HAS[#name[BE-4?V2]]
        {
            @title = BE-42 Block 21
            @descriptionSummary = BE-42 Block 21 flown on the 3rd flight onwards of New Glenn. <color="red">Warranty void if used during static fire.</color>
        }
        @SUBTYPE:HAS[#name[BE-4?V3]]
        {
            @title = BE-42 Block 69
            @descriptionSummary = BE-42 Block 69 demonstrated on the test stand but not yet flown, but planned to fly on New Glenn 9x4.
        }
        @SUBTYPE:HAS[#name[BE-4?V4]]
        {
            @title = BE-42 Block 67
            @descriptionSummary = BE-42 Block 67, a purely theorethical Block following the same increase from JE-367 Block 67 to its original anticipated thrust.
        }
    }
}
