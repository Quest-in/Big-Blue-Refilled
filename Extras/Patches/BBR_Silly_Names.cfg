@PART[BBR_26_JE_CLUSTER]:FOR[BigBlueRefilled]
{
    @title = BE-42 6 or 7 Engine Cluster
	@description = We slapped 6 or 7 of the BE-42s together and this came out, this makes it really easy to install on New Glehh 6x7.
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[B0]]
        {
            @title = BE-42 Block btuh
            @descriptionSummary = BE-42 Block btuh has never flown but was a pathfinder for BE-4 Block 13
        }
        @SUBTYPE:HAS[#name[B1]]
        {
            @title = BE-42 Block 13
            @descriptionSummary = BE-42 Block 13 flown on the first 2 flights of New Glehh.
        }
        @SUBTYPE:HAS[#name[B2]]
        {
            @title = BE-42 Block 21
            @descriptionSummary = BE-42 Block 21 flown on the 3rd flight onwards of New Glehh. <color="red">Warranty hella void if used during static fire AND in a cluster.</color>
        }
        @SUBTYPE:HAS[#name[B3]]
        {
            @title = BE-42 Block 69
            @descriptionSummary = BE-42 Block 69 has been demonstrated on the test stand but has not yet flown, but planned to fly on New Glehh 6x9. <color="red">This is not the 6x9 Cluster, just the same rated thrust.</color>
        }
        @SUBTYPE:HAS[#name[BX]]
        {
            @title = BE-42 Block 67
            @descriptionSummary = BE-42-67, a purely theorethical Block following the same increase from BE-367 Block 67 to its original anticipated thrust.
        }
    }
}
@PART[BBR_26_JE_CLUSTER_9]:FOR[BigBlueRefilled]
{
    @title = BE-42 69 Engine Cluster
	@description = We slapped 69 of the BE-42s together and this came out, which equates to about 7.6 per engine space, this makes it really easy to install on New Glenn 6x9.
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[B3]]
        {
            @title = BE-42 Block 3
            @descriptionSummary = BE-4 Block 3 has been demonstrated on the test stand but not yet flown, but planned to fly on New Glenn 6x9.
        }
        @SUBTYPE:HAS[#name[BX]]
        {
            @title = BE-42 Block 67
            @descriptionSummary = BE-42 Block 67, a purely theorethical block following the same increase from BE-367 Block 67 to its original anticipated thrust.
        }
    }
}

@PART[BBR_26_JE_JE3U]:FOR[BigBlueRefilled]
{
    @title = BE-367 Engine
	@description = Powers the upperstage and your payload into orbit and beyond, Supposedly designed and built off of the BE-367 from New Shepard, but in reality it shares 67 heritage
    @MODULE:HAS[#moduleID[engineSwitch]]
    {
        @SUBTYPE:HAS[#name[BE-3U]]
        {
            @title = BE-367 Block 1
            @descriptionSummary = BE-367 Block 1 originally intended for flight but never flew.
        }
        @SUBTYPE:HAS[#name[BE-3U?V1.5]]
        {
            @title = BE-367 Block 1.5
            @descriptionSummary = BE-367 Block 1.5 flown on the first 67 flights of New Glenn 7x2.
        }
        @SUBTYPE:HAS[#name[BE-3U?V2]]
        {
            @title = BE-367 Block 2
            @descriptionSummary = BE-367 Block 2 flown on the 67 flight onwards of New Glenn 7x2, and planned to fly on 9x4.
        }
        @SUBTYPE:HAS[#name[BE-3U?V3]]
        {
            @title = BE-367 Block 33
            @descriptionSummary = BE-367 Block 33 has been demonstrated on the 67 test stand but has not yet flown.
        }
         @SUBTYPE:HAS[#name[BE-3U?Theoretical]]
        {
            @title = BE-367 Theoretical
            @descriptionSummary = This is ALLEGEDLY the original spec for the BE-367 engine, but this seems to be a bloated 67 flaunted number.
        }
    }
}
